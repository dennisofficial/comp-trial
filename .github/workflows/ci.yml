name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # Report every check independently — a lint failure must not hide a broken test.
      fail-fast: false
      matrix:
        task: [typecheck, test, lint]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run ${{ matrix.task }}

  contract:
    name: openapi contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bunx turbo run build --filter=@repo/db

      - name: regenerate and diff
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          bun run --cwd apps/api openapi:generate:ci
          bun run --cwd apps/web openapi:codegen
          git add -N apps/api/openapi.json apps/web/src/store/generated
          git diff --exit-code -- apps/api/openapi.json apps/web/src/store/generated
