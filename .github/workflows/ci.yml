name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      - run: bun run test

      - run: bun run lint

      - name: openapi contract is in sync
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          bun run --cwd apps/api openapi:generate:ci
          bun run --cwd apps/web openapi:codegen
          git add -N apps/api/openapi.json apps/web/src/store/generated
          git diff --exit-code -- apps/api/openapi.json apps/web/src/store/generated
